name: CI

# Runs on every push to dev or a feature branch, and on pull requests into dev.
on:
  push:
    branches: [dev, "feature/**"]
  pull_request:
    branches: [dev]

permissions:
  contents: read

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (C++11, sanitizers)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Engine compiles as C++11
        run: make check11

      - name: Unit tests for the mediator and strategies (AddressSanitizer and UBSan)
        run: make unit

      - name: Integration tests (AddressSanitizer and UBSan)
        run: make test
